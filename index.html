<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Page Remover</title><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#0b0f17;color:#f5f7fb}.wrap{max-width:1100px;margin:auto;padding:30px 16px}.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:42px;margin:0 0 8px}.muted{color:#9aa5b8}.panel{background:#121824;border:1px solid #263044;border-radius:20px;padding:22px}.drop{border:2px dashed #3a4760;border-radius:18px;padding:65px 20px;text-align:center;cursor:pointer}.drop:hover{border-color:#7282ff;background:#161d2d}.drop b{font-size:20px;display:block;margin-bottom:8px}input{display:none}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.stats{margin-right:auto}.btn{border:0;border-radius:10px;padding:11px 15px;background:#293347;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#6878ff}.danger{background:#df4c62}.green{background:#2da56b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.page{position:relative;background:#0c111a;border:2px solid #273147;border-radius:14px;padding:8px;cursor:pointer}.page.selected{border-color:#6878ff;box-shadow:0 0 0 3px #6878ff22}.page canvas{display:block;width:100%;background:white;border-radius:8px}.label{text-align:center;font-weight:700;padding:8px 0 3px}.tick{position:absolute;right:14px;top:14px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#1d2635;border:2px solid #69758c}.selected .tick{background:#6878ff;border-color:#6878ff}.msg{margin:14px 0;padding:11px 13px;border-radius:10px;background:#192130}.err{background:#351c24;color:#ffb8c3}.hidden{display:none!important}@media(max-width:600px){.hero h1{font-size:31px}.panel{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.bar .btn{flex:1}}
</style></head><body><main class="wrap"><section class="hero"><h1>PDF Page Remover</h1><p class="muted">Select any pages, remove them, and download the edited PDF.</p></section><section class="panel"><div id="drop" class="drop"><b>Drop your PDF here</b><span class="muted">or click to choose a PDF</span><input id="file" type="file" accept="application/pdf,.pdf"></div><div id="editor" class="hidden"><div class="bar"><div class="stats"><b id="name">PDF</b> · <span id="count">0 pages</span> · <span id="sel">0 selected</span></div><button class="btn" id="all">Select All</button><button class="btn" id="none">Deselect All</button><button class="btn danger" id="del" disabled>Delete Selected</button><button class="btn" id="reset">Start Over</button><button class="btn green" id="download" disabled>Download PDF</button></div><div id="msg" class="msg hidden"></div><div id="grid" class="grid"></div></div></section></main><script type="module">
import * as pdfjs from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const {PDFDocument}=PDFLib;let bytes=null,selected=new Set(),edited=false,fileBase='document';
const $=id=>document.getElementById(id);function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}
function controls(){$('sel').textContent=`${selected.size} selected`;$('del').disabled=!selected.size;$('download').disabled=!edited}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').style.borderColor='#6878ff'};$('drop').ondragleave=()=>{$('drop').style.borderColor=''};$('drop').ondrop=e=>{e.preventDefault();$('drop').style.borderColor='';e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
async function load(f){try{if(!f.name.toLowerCase().endsWith('.pdf'))throw Error('Not PDF');bytes=new Uint8Array(await f.arrayBuffer());const d=await PDFDocument.load(bytes);if(!d.getPageCount())throw Error('Empty');fileBase=f.name.replace(/\.pdf$/i,'');edited=false;selected.clear();$('name').textContent=f.name;$('editor').classList.remove('hidden');await render()}catch(e){msg('Could not open this PDF. It may be corrupted or protected.',true);console.error(e)}}
async function render(){const grid=$('grid');grid.innerHTML='';selected.clear();controls();const pdf=await pdfjs.getDocument({data:bytes.slice()}).promise;$('count').textContent=`${pdf.numPages} ${pdf.numPages===1?'page':'pages'}`;for(let n=1;n<=pdf.numPages;n++){const card=document.createElement('div');card.className='page';const c=document.createElement('canvas');const tick=document.createElement('div');tick.className='tick';tick.textContent='✓';const label=document.createElement('div');label.className='label';label.textContent='Page '+n;card.append(c,tick,label);card.onclick=()=>{const i=n-1;if(selected.has(i)){selected.delete(i);card.classList.remove('selected')}else{selected.add(i);card.classList.add('selected')}controls()};grid.append(card);thumb(pdf,n,c)}}
async function thumb(pdf,n,c){const p=await pdf.getPage(n),v=p.getViewport({scale:1}),s=Math.min(260/v.width,1.5),vp=p.getViewport({scale:s});c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
$('all').onclick=()=>{selected=new Set([...$('grid').children].map((_,i)=>i));[...$('grid').children].forEach(x=>x.classList.add('selected'));controls()};$('none').onclick=()=>{selected.clear();[...$('grid').children].forEach(x=>x.classList.remove('selected'));controls()};
$('del').onclick=async()=>{try{const source=await PDFDocument.load(bytes),total=source.getPageCount();if(selected.size>=total){msg('At least one page must remain.',true);return}msg('Removing selected pages…');const out=await PDFDocument.create();const keep=[];for(let i=0;i<total;i++)if(!selected.has(i))keep.push(i);const pages=await out.copyPages(source,keep);pages.forEach(p=>out.addPage(p));bytes=new Uint8Array(await out.save());edited=true;await render();msg('Selected pages removed successfully.');controls()}catch(e){msg('Unable to delete the selected pages.',true);console.error(e)}};
$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=fileBase+'-edited.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('reset').onclick=()=>{bytes=null;selected.clear();edited=false;$('editor').classList.add('hidden');$('grid').innerHTML='';$('file').value='';$('msg').className='msg hidden';controls()};
</script></body></html>
